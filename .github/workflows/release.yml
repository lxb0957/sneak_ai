name: Release

# 打一个 tag 就发布。三个 job 串行：
#
#   gate    → 跑与 CI 完全相同的测试清单（同一个 workflow 文件，不是抄一份）
#   build   → windows-latest 上打包 + 用产物真跑 --selfcheck + 算 sha256
#   publish → 建/更新 Release，上传 exe，贴正文
#
# 为什么打包必须在 windows-latest 上做：PyInstaller **不能交叉编译**。
# 在 Linux 上跑它，产出的是一个 Linux 可执行文件，不是 exe。
# 这也是整条链子必须放在 CI 而不是"本地打包后上传"的根本原因 ——
# 本地那条路要靠人记得每一步（改名、哈希、上传、写正文），
# 而人记得住的步骤，迟早会在某个赶时间的晚上漏掉一步。

on:
  push:
    tags: ['v*']
  # 手动重发：填一个已存在的 tag。用途是"发布之后发现 notes 写错了"——
  # 改 docs/releases/<tag>.md、推上去、在这里重跑，不用手动去网页上改。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在）'
        required: true
        type: string

permissions:
  contents: write        # 建 Release、传附件

# 同一个 tag 同时只跑一条流水线：重跑时应该取消旧的，
# 而不是让两条同时去 create release（会撞 422 already_exists）。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  SDL_VIDEODRIVER: dummy      # 无显示器环境；selfcheck 靠它跑得起来
  SDL_AUDIODRIVER: dummy
  TAG: ${{ inputs.tag || github.ref_name }}
  PYTHONUTF8: '1'             # Windows runner 默认 cp936，中文字符串进出要 UTF-8

jobs:
  gate:
    name: 发布门禁
    # 只跑一个 Python 版本：发布验的是"能不能打包、能不能玩"，
    # 兼容性由 ci.yml 的双版本矩阵负责，不必在发布时重算一遍。
    uses: ./.github/workflows/test-suite.yml
    with:
      python-versions: '["3.11"]'
      ref: ${{ inputs.tag || github.ref }}

  build:
    name: build (win64)
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      exe_name: ${{ steps.pack.outputs.exe_name }}
      sha256: ${{ steps.hash.outputs.sha256 }}
      size: ${{ steps.hash.outputs.size }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0     # publish 要用 git log 生成正文，需要完整历史

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 产物名由打包器一步到位，不在流水线里改中文文件名：
      # 默认名是「潜行协议」，而"在 PowerShell 里重命名中文文件、再把结果
      # 交给下一个 shell 步骤"要横跨 cp936 / cp65001 两套编码。
      # 中文名留给双击玩的人，ASCII 名给机器。
      - name: 打包
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          NAME="StealthProtocol-${TAG}-win64"
          python build_exe.py --name "$NAME"
          test -f "dist/${NAME}.exe" || { echo "::error::没有产出 dist/${NAME}.exe"; exit 1; }
          echo "exe_name=${NAME}.exe" >> "$GITHUB_OUTPUT"

      # 关键一步：验的是**打包产物本身**，不是源码。
      # 入口相对导入、_MEIPASS 路径、SDL 动态库有没有被收进去 ——
      # 这些只有真跑那个 exe 才测得出来，而它们恰好是打包最容易漏的。
      - name: 自检（真跑打包产物，五关各 120 帧）
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          "./dist/${{ steps.pack.outputs.exe_name }}" --selfcheck

      - name: 算 sha256 与体积
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          F="dist/${{ steps.pack.outputs.exe_name }}"
          SUM=$(sha256sum "$F" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$F")
          echo "sha256=${SUM}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "${{ steps.pack.outputs.exe_name }}  ${SIZE} B  sha256 ${SUM}"

      - uses: actions/upload-artifact@v4
        with:
          name: win64-exe
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 注意这里**不**跟着 inputs.tag 走，用的是触发本次 workflow 的 ref。
      #
      # 这是踩出来的：publish 一开始 checkout 的是被发布的 tag，于是
      # `python scripts/publish_release.py` 报 "No such file or directory" ——
      # 那个脚本是修流水线时才写的，老 tag 里当然没有。
      # 后果是"修了流水线的 bug 却永远用不上"，因为修好的脚本进不了那一版。
      #
      # 分工应该是：
      #   gate / build  → checkout **tag**（被打包的是那个提交，必须一致）
      #   publish       → checkout **触发 ref**（打包和发布用的工具，要最新的）
      # **工具和被加工物必须解耦。** 混成一个 ref，工具就永远追不上 bug。
      #
      # 触发 ref 在两种场景下都对：tag push 时它就是那个 tag；
      # 手动重发时它是 main —— 正好是用最新脚本去发老版本。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: win64-exe
          path: dist

      # 正文：优先读 docs/releases/<tag>.md（人写的，能回答"这一版是干嘛的"），
      # 没有就按上一个 tag 之后的 commit 自动生成（至少不会发出一版空正文）。
      - name: 生成正文与标题
        run: python scripts/release_notes.py --tag "$TAG" --out-dir rel

      # 校验和由构建产出，不该由人手抄进正文 —— 抄错一个字符，
      # 下载的人校验失败时根本分不清是文件坏了还是写错了。
      - name: 附加校验信息
        shell: bash
        run: |
          set -euo pipefail
          {
            cat rel/notes.md
            echo
            echo '## 校验'
            echo
            echo '```'
            printf '%s\n' '${{ needs.build.outputs.exe_name }}'
            printf 'size   %s B\n' '${{ needs.build.outputs.size }}'
            printf 'sha256 %s\n' '${{ needs.build.outputs.sha256 }}'
            echo '```'
            echo
            echo 'Windows 上核对：`certutil -hashfile <文件名> SHA256`'
          } > rel/notes_full.md
          tail -12 rel/notes_full.md

      # 幂等不是"顺手加的便利"，是**修复的入口**。
      #
      # 这里分成两步，不是因为洁癖，是因为它们的失败模式完全不同：
      # 改元数据是 API 语义问题，传附件是带宽问题，混在一起时，
      # 一个失败你分不清是哪种。
      #
      # 为什么元数据不用 `gh release edit`（踩出来的）：
      # 对 release 发**不带 `tag_name` 的 PATCH** 在这个仓库上稳定 500 ——
      #   PATCH {name} / {body} / {name,body,draft}  -> 500
      #   PATCH {..., tag_name}                      -> OK
      # gh 用 release **id** 定位、payload 里不带 tag_name，于是必挂。
      # 诱因是删过又重建 tag，release 内部那条 ref 关系脏了。
      # `scripts/publish_release.py` 显式带上 tag_name，并自己做幂等：
      # 查到就 PATCH、404 就 POST，两种情况都收敛到"存在且已发布"。
      - name: 建 / 更新 Release 元数据
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/publish_release.py \
            --tag "$TAG" \
            --title-file rel/title.txt \
            --body-file rel/notes_full.md

      - name: 上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.exe --clobber

      - name: 确认终态
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --json url,isDraft,assets \
            --template '{{.url}}  draft={{.isDraft}}{{"\n"}}{{range .assets}}{{.name}} {{.size}}B{{"\n"}}{{end}}'
